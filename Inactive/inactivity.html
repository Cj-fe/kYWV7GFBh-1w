<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temporarily Inactive</title>
    <style>
        body  {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f8f9fa;
            text-align: center;
        }
        
        .container {
            max-width: 600px;
            padding: 20px;
        }
        
        h1 {
            color: #333;
            font-size: 36px;
            margin-bottom: 20px;
        }
        
        p {
            color: #666;
            font-size: 18px;
            line-height: 1.5;
        }
        
        #lottie-container {
            width: 350px;
            height: 350px;
            margin: 0 auto 30px;
        }
    </style>
    <!-- Import Lottie player from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.9.6/lottie.min.js"></script>
</head>
<body>
    <div class="container">
        <div id="lottie-container"></div>
        <h1>Site temporarily inactive</h1>
        <p>We're taking a break now that our capstone has ended. The site is currently in sleep mode but will be back online soon. Thank you for your patience.</p>
        <p>This is not an error, just a planned maintenance period. Please check back later!</p>
    </div>

    <script>
        // Initialize the Lottie animation
        var animation = bodymovin.loadAnimation({
            container: document.getElementById('lottie-container'),
            renderer: 'svg',
            loop: true,
            autoplay: true,
            path: 'sleeping_sloth.json' // Path to your sleeping_sloth.json file
        });
    </script>
</body>
</html>
